</head>

 });
 S.geo.forEach(q=>{

 };
 (function loop(){

  Ca.position.set(O.x+Math.sin(O.yaw)*Math.cos(O.pit)*O.d,Math.sin(O.pit)*O.d,O.z+Math.cos(O.yaw)*Math.cos(O.pit)*O.d);
  Ca.lookAt(O.x,0,O.z);

  R.render(Sc,Ca);requestAnimationFrame(loop)

const luaStr=s=>'"'+String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n')+'"';
function luaObjeto(o,i){
 const id=i+1,name='obj'+id,atlas=S.a[o.a]?`atlas[${o.a+1}]`:'nil';
 const cy=o.t=='esfera'?o.y+o.r:o.y+o.h/2;
 let ctor;
 if(o.t=='cubo')ctor=`mapa:cubo(${n(o.x)}, ${n(cy)}, ${n(o.z)}, ${n(o.w)}, ${n(o.h)}, ${n(o.d)}, ${+o.tc||0}, ${+o.tl||0})`;
 else if(o.t=='esfera')ctor=`mapa:esfera(${n(o.x)}, ${n(cy)}, ${n(o.z)}, ${n(o.r)}, 16, 12, ${+o.tc||0}, ${+o.tl||0})`;
 else if(o.t=='bb')ctor=`mapa:billboard(${n(o.x)}, ${n(cy)}, ${n(o.z)}, ${n(o.w)}, ${n(o.h)}, ${+o.tc||0}, ${+o.tl||0})`;
 else if(o.t=='poli'){
  const q=piv(o),ps=o.pts.map(p=>`{${n(p[0]-q[0])}, ${n(p[1]-q[1])}}`).join(', ');
  ctor=`mapa:poligono(${n(q[0])}, ${n(o.y)}, ${n(q[1])}, {${ps}}, ${n(o.h)}, ${+o.tc||0}, ${+o.tl||0})`;
 }else ctor=`mapa:${o.t}(${n(o.x)}, ${n(cy)}, ${n(o.z)}, ${n(o.r)}, ${n(o.h)}, 16, ${+o.tc||0}, ${+o.tl||0})`;
 const L=[];
 L.push(`mapa:atlas(${atlas})`,`local ${name} = ${ctor}`,`if ${name} then`);
 if(o.cc!=null)L.push(`    ${name}:tile_cima(${+o.cc||0}, ${+o.cl||0})`);
 if(o.bc!=null)L.push(`    ${name}:tile_baixo(${+o.bc||0}, ${+o.bl||0})`);
 if(o.t=='cubo'){
  if(o.frc!=null)L.push(`    ${name}:tile_frente(${+o.frc||0}, ${+o.frl||0})`);
  if(o.trc!=null)L.push(`    ${name}:tile_tras(${+o.trc||0}, ${+o.trl||0})`);
  if(o.esc!=null)L.push(`    ${name}:tile_esquerda(${+o.esc||0}, ${+o.esl||0})`);
  if(o.dic!=null)L.push(`    ${name}:tile_direita(${+o.dic||0}, ${+o.dil||0})`);
 }
 if(o.t=='cilindro'||o.t=='poli')L.push(`    ${name}:tile_lado(${+o.tc||0}, ${+o.tl||0})`);
 if(o.est)L.push(`    ${name}:repetir(1, 1, false)`);
 if(o.t=='bb'){
  L.push(`    ${name}:billboard(obj3d.${o.bt=='e'?'BB_ESFERICO':'BB_CILINDRICO'})`);
  if(o.col)L.push(`    ${name}:colisao(true)`,`    ${name}:colisao_raio(${n(o.cr||0)})`);
  if(o.rot)L.push(`    ${name}:rotacionar(0, 0, ${n(o.rot)})`);
 }else if(o.rot||o.rx)L.push(`    ${name}:rotacionar(${n(o.rx||0)}, ${n(o.rot||0)}, 0)`);
 if(o.spin&&(+o.spin.x||+o.spin.y||+o.spin.z))L.push(`        mapa:girar(${name}, ${n(o.spin.x||0)}, ${n(o.spin.y||0)}, ${n(o.spin.z||0)})`);
 const m=o.mov||{},aid=`atuador${id}`;
 if(m.tipo&&m.tipo!='nenhum'){
  if(m.tipo=='personalizado'){
   L.push(`        local ${aid} = mapa:atuador(${name})`,`        if ${aid} then`,`            mapa:atuador_deslocar(${aid}, ${n(m.dx||0)}, ${n(m.dy||0)}, ${n(m.dz||0)})`);
   if(m.girar)L.push(`            mapa:atuador_giro(${aid}, ${n(m.px||0)}, ${n(m.pz||0)}, ${n(m.graus||0)})`);
   L.push(`            mapa:atuador_velocidade(${aid}, ${n(m.vel||2)})`,'        end');
  }else if(m.tipo=='porta_deslizar')L.push(`        local ${aid} = mapa:porta_deslizar(${name}, ${n(m.dx||0)}, ${n(m.dy||0)}, ${n(m.dz||0)}, ${n(m.vel||2)})`);
  else if(m.tipo=='porta_subir')L.push(`        local ${aid} = mapa:porta_subir(${name}, ${n(m.dy||0)}, ${n(m.vel||2)})`);
  else if(m.tipo=='porta_descer')L.push(`        local ${aid} = mapa:porta_descer(${name}, ${n(m.dy||0)}, ${n(m.vel||2)})`);
  else if(m.tipo=='porta_girar')L.push(`        local ${aid} = mapa:porta_girar(${name}, ${n(m.px||0)}, ${n(m.pz||0)}, ${n(m.graus||90)}, ${n(m.vel||120)})`);
  else if(m.tipo=='elevador')L.push(`        local ${aid} = mapa:elevador(${name}, ${n(m.dy||0)}, ${n(m.vel||2)})`);
  else if(m.tipo=='andador')L.push(`        local ${aid} = mapa:andador(${name}, ${n(m.dx||0)}, ${n(m.dy||0)}, ${n(m.dz||0)}, ${n(m.vel||2)}, ${n(m.pausa||0)}, true)`);
  const it=o.it;
  L.push(`        if ${aid} then`,`            mapa:atuador_modo(${aid}, mapa3d.MOV_${m.modo||'ALTERNAR'})`,`            mapa:atuador_curva(${aid}, mapa3d.CURVA_${m.curva||'SUAVE'})`,`            mapa:atuador_pausa(${aid}, ${n(m.pausa||0)})`,`            mapa:atuador_carregar(${aid}, ${m.carregar?'true':'false'})`,`            mapa:atuador_ativo(${aid}, ${m.ativo===0?'false':'true'})`);
  if(m.tipo=='porta_deslizar'||m.tipo=='porta_subir'||m.tipo=='porta_descer'||m.tipo=='porta_girar'||m.tipo=='personalizado')L.push(`            mapa:atuador_auto_fechar(${aid}, ${n(m.auto_fechar===undefined?5:m.auto_fechar)})`);
  if(it&&it.ativo)L.push(`            local inter${id} = mapa:interativo(${name}, ${n(it.alcance||2)})`,`            if inter${id} then`,`                mapa:interativo_entrada(inter${id}, mapa3d.ENTRADA_${it.entrada||'APERTAR'})`,`                mapa:interativo_acao(inter${id}, mapa3d.ACAO_${it.acao||'ALTERNAR'}, ${n(it.valor||0)})`,`                mapa:interativo_ligar(inter${id}, ${aid})`,`                mapa:interativo_olhar(inter${id}, ${n(it.olhar||0)})`,`                mapa:interativo_recarga(inter${id}, ${n(it.recarga||0)})`,`                mapa:interativo_uma_vez(inter${id}, ${it.uma_vez?'true':'false'})`,`            end`);
  L.push('        end');
 }else if(o.it&&o.it.ativo)L.push('    -- Interação sem efeito: configure um atuador para este objeto.');
 L.push('end');return L
}
